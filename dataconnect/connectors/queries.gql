query GetSkills($searchTerm: String = "", $limit: Int = 10) @auth(level: PUBLIC insecureReason: "Skilsl should be visible to everyone") {
  skills(
    where: {
      _or: [
        { title: { contains: $searchTerm }}
        { description: { contains: $searchTerm }}
      ] 
    },
    orderBy: [ {
      createdAt: DESC
    }],
    limit: $limit
  ),
  {
    id title description tags createdAt installCommand
    author { username imageUrl clerkId email } 
  }
}